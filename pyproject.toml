[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cop-corpus"
version = "0.1.0"
description = "Corpus vérifiable, veille en temps réel et alertes pour suivre la COP31"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "PyMuPDF>=1.24.3",
  "python-docx>=1.1",
  "feedparser>=6",
  "trafilatura>=1.12",
  "numpy>=1.26",
  "openai>=1.40",
  "mcp>=1.20,<2",
  "pyjwt[crypto]>=2.8",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "aiosmtpd>=1.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cop = "cop_corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cop_corpus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
