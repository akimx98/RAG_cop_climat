# à confirmer — bloqué Imperva (unfccc.int renvoie un challenge anti-bot à tout client non-navigateur)
# Structure relevée sur l'archive Wayback (22–27 oct. 2026) : les pages /event/* listent des liens /documents/NNNNNN
# (pagination Drupal ?page=N) ; chaque page /documents/NNNNNN pointe vers « /sites/default/files/resource/<cote>{A,C,E,F,R,S}.pdf »
# (ex. cp2026_01E.pdf, attention : href avec espace initial). Équivalent accessible : entrées ods ci-dessus.
- id: unfccc-cop31-session-pages
  type: crawl
  start: ['https://unfccc.int/cop31', 'https://unfccc.int/event/cop-31', 'https://unfccc.int/event/cma-8', 'https://unfccc.int/event/cmp-21', 'https://unfccc.int/event/sbi-65', 'https://unfccc.int/event/sbsta-65']
  follow: ['^https://unfccc\.int/documents/\d+$', '^https://unfccc\.int/event/(cop-31|cma-8|cmp-21|sbi-65|sbsta-65)(\?page=\d+)?$']
  collect:
    - '^https://unfccc\.int/sites/default/files/resource/[^/]+[EF]?\.pdf$'
  max_depth: 2
  max_docs: 400
  level: 2
  org: UNFCCC
  doc_type: autre
  session: COP31
  title_from: page_title
  watch_minutes: 15

# à confirmer — bloqué Imperva (unfccc.int renvoie un challenge anti-bot à tout client non-navigateur)
# à confirmer — URL devinée par analogie : COP29 = https://unfccc.int/cop29/auvs (archivée), COP30 sans page /auv(s) archivée.
# Sur /cop29/auvs, les liens sont absolus « https://unfccc.int/documents/64xxxx » puis PDF sous /sites/default/files/resource/.
# Pas d'équivalent ODS : les AUV (advance unedited versions) ne reçoivent pas de cote ; les documents L. (ods ci-dessus) en sont la version officielle.
- id: unfccc-cop31-auv-draft-texts
  type: crawl
  start: ['https://unfccc.int/cop31/auvs']
  follow: ['^https://unfccc\.int/documents/\d+$']
  collect: ['^https://unfccc\.int/sites/default/files/resource/.+\.pdf$']
  max_depth: 2
  max_docs: 300
  level: 2
  org: UNFCCC
  doc_type: projet_texte
  session: COP31
  title_from: link_text
  watch_minutes: 10

