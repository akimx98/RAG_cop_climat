# CDN (contributions déterminées au niveau national) et rapports de synthèse.
# Le registre officiel https://unfccc.int/NDCREG est derrière Imperva : gardé « à confirmer ».
# Alternative vérifiée (HTTP 200, application/json) : API Climate Watch (WRI), une URL par Partie qui renvoie
# une LISTE JSON de documents [{document_type, language, html, ...}] : le texte intégral de chaque CDN est dans le
# champ « html ». ATTENTION pipeline : ce n'est ni un PDF ni une page HTML -> prévoir un extracteur JSON
# (itérer sur la liste, 1 document par élément, titre = location.name + document_type + language).
# Exemples : EUU = UE (second_ndc = CDN 2035 du 05/11/2025), CHN third_ndc (EN+CN), BRA second_ndc (= CDN 3.0 2024).

# à confirmer — bloqué Imperva (unfccc.int renvoie un challenge anti-bot à tout client non-navigateur)
# Registre complet des CDN (toutes générations : INDC, 1re CDN, mises à jour, CDN 3.0). Structure non vérifiable
# (snapshots Wayback = page de challenge). Alternative accessible : entrées climatewatch ci-dessous.
- id: unfccc-ndc-registry
  type: crawl
  start: ['https://unfccc.int/NDCREG']
  follow: ['^https://unfccc\.int/NDCREG(\?.*page=\d+.*)?$', '^https://unfccc\.int/documents/\d+$']
  collect: ['^https://unfccc\.int/sites/default/files/NDC/.+\.pdf$', '^https://unfccc\.int/sites/default/files/resource/.+\.pdf$']
  max_depth: 3
  max_docs: 900
  level: 2
  org: UNFCCC
  doc_type: ndc
  title_from: link_text
  watch_minutes: 0

# Source alternative au registre NDC (unfccc.int bloqué). JSON : ndcs[].{document_type, language, location.iso_code3}.
# document_type ∈ indc | first_ndc | revised_first_ndc | second_ndc | third_ndc (au 2026-11-06 : 197/241/184/62/137).
- id: unfccc-ndc-climatewatch-index
  type: doc
  url: 'https://www.climatewatchdata.org/api/v1/ndcs/text'
  title: 'Climate Watch (WRI) — index JSON des textes de CDN disponibles (821 documents, 197 Parties)'
  level: 2
  org: WRI Climate Watch
  doc_type: ndc
  topics: [ndc, index]
  lang: en
  watch_minutes: 1440

