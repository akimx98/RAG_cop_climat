# Autres États et groupes de négociation — positions publiques (à lire avec mesure : ce sont
# des communiqués/déclarations de parties, pas des textes négociés). Vérifié le 2026-11-06
# (User-Agent "cop-corpus/0.1 (veille documentaire)").
# NB : cop31-antalya.com n'est PAS le site officiel (blog d'un cabinet de conseil) — écarté.
# Le site officiel de la présidence est https://cop31.tr (réinitialisations de connexion
# intermittentes observées : prévoir des retries). www.dcceew.gov.au (Australie) : timeout / erreur
# HTTP/2 pour un client non-navigateur ; le sous-site unfccc-cop.dcceew.gov.au répond 200.

