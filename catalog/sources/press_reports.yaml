# --- Earth Negotiations Bulletin (IISD) --------------------------------------------------
- id: enb-daily-pdf
  type: enb
  # Comptes rendus quotidiens en PDF (enb.py) : sites/default/files/<aaaa-mm>/enb<vol><nnn><e|f>.pdf.
  # COP31 : volume 12, n° 902 = « COP 31 #1 » (paru le 10/11, journée du 9/11) ; n° 909 = #8 (18/11, journée du 17/11).
  # Numéro, parution et journée couverte lus dans l'en-tête du PDF ; e = anglais, f = français.
  vol: 12
  first: 902
  last: 925
  langs: [e, f]
  stop_after_misses: 2
  level: 4
  org: Earth Negotiations Bulletin
  doc_type: compte_rendu
  session: COP31
  topics: [negotiations_summary]
  watch_minutes: 60

