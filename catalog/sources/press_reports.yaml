# --- Lectures militantes, utiles pour anticiper les positions (ajout 07/11/2026) -------------------
- id: can-eco-newsletter
  type: rss
  # ECO paraît chaque matin pendant les sessions, uniquement en ligne (pas de liste de diffusion).
  # Le flux de la catégorie renvoie vers une page par numéro, dont le texte complet est extrait.
  url: https://climatenetwork.org/resource_type/eco-newsletter/feed/
  level: 5
  org: Climate Action Network (ECO, ONG)
  doc_type: analyse
  watch_minutes: 30

- id: twn-climate-info
  type: crawl
  # Third World Network : notes « Info Service on Climate Change » et comptes rendus quotidiens de
  # session. Les pages <ville>.news.NN.htm ne sont que des index : on les suit pour collecter les PDF
  # « TWN update N » (news/Bonn27/, news/Belem01/…). Attendu pour la COP31 : antalya.news.01.htm et
  # news/Antalya01/ (nom deviné : vérifier le 10/11 sur https://twn.my/ et ajuster au besoin).
  # Lecture G77 / LMDC, engagée.
  start:
    - https://twn.my/
    - https://twn.my/title2/climate/climate.new.htm
    - https://twn.my/title2/climate/climate_updates-briefings.htm
  follow:
    - '^https://twn\.my/title2/climate/(bonn\.news\.27|belem\.news\.01|(antalya|cop31|turkiye|turkey)[a-z]*\.?news\.?[0-9]*)\.htm$'
  collect:
    - '^https://twn\.my/title2/climate/info\.service/202[56]/cc[0-9]+\.htm$'
    - '^https://twn\.my/title2/climate/news/(Bonn27|Belem01|Antalya|COP31|Turkiye|Turkey)[^/]*/.+\.pdf$'
  max_depth: 1
  max_docs: 200
  level: 4
  org: Third World Network (lecture G77 / LMDC)
  doc_type: compte_rendu
  title_from: link_text
  watch_minutes: 60
