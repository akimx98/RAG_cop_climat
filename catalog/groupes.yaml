  parser: ohrlls_numbered
  attendu: 39
  alias: [PEID, Small Island Developing States]
  note: "Catégorie de l'ONU ; le groupe qui négocie est l'AOSIS."
- id: AOSIS
  nom: Alliance des petits États insulaires
  type: negociation
  source: https://www.aosis.org/about/member-states/
  parser: aosis
  attendu: 39
  alias: [Alliance of Small Island States, AOSIS]
- id: EIG
  nom: Groupe pour l'intégrité environnementale
  type: negociation
  source: https://unfccc.int/process-and-meetings/parties-non-party-stakeholders/parties/party-groupings
  releve: "2026-11-17"
  citation: "The Environmental Integrity Group (EIG), formed in 2000, comprises Mexico, Liechtenstein, Monaco, the Republic of Korea, Switzerland, and Georgia."
  membres: [Mexico, Liechtenstein, Monaco, Republic of Korea, Switzerland, Georgia]
  attendu: 6
  alias: [Environmental Integrity Group, GIE]
- id: Umbrella Group
  nom: Groupe parapluie
  type: coalition
  source: https://unfccc.int/process-and-meetings/parties-non-party-stakeholders/parties/party-groupings
  releve: "2026-11-17"
  citation: "The Group is made up of Australia, Canada, Iceland, Israel, Japan, New Zealand, Kazakhstan, Norway, Ukraine, and the United States. The United Kingdom is the latest addition to the groups, when it formally joined in 2023."
  membres: [Australia, Canada, Iceland, Israel, Japan, New Zealand, Kazakhstan, Norway, Ukraine, United States, United Kingdom]
  depuis: {United Kingdom: "2023"}
  attendu: 11
  note: "Coalition informelle, composition variable : liste valable à la date du relevé."
  alias: [Umbrella, Groupe parapluie]
- id: BASIC
  nom: Brésil, Afrique du Sud, Inde, Chine
  type: coalition
  source: https://unfccc.int/process-and-meetings/parties-non-party-stakeholders/parties/party-groupings
  releve: "2026-11-17"
  citation: "The BASIC Group is a coalition of four major emerging economies - Brazil, South Africa, India, and China - that coordinate their positions in international climate change negotiations."
  membres: [Brazil, South Africa, India, China]
  attendu: 4
  alias: [BASIC]
