# Groupes de négociation de la CCNUCC : définition et SOURCE de la liste des membres.
# Règle : pas de liste sourcée → pas de membres (statut « non_verifie »), jamais de liste de mémoire.
#   id        nom canonique (celui de positions.normalize_actor : « LDC », « G77 and China »…)
#   type      onu (catégorie définie par l'ONU) | negociation (groupe qui négocie d'une voix) | coalition (informelle)
#   source    page publique qui liste les membres ; parser : méthode de lecture (groupes.PARSERS)
#   attendu   nombre de membres annoncé par la source ou par la page « Party groupings » de la CCNUCC ; un écart est
#             signalé (statut « ecart ») et la liste n'est pas présentée comme vérifiée
#   alias     autres noms (FR / EN / sigles)
#   membres   (au lieu de parser) relevé daté d'une page qui ne peut pas être relue automatiquement (page de la CCNUCC
#             protégée par un anti-bot, jamais contourné) : liste recopiée de la phrase citée (`citation`) le jour `releve`
#   depuis    (optionnel) {membre: année d'adhésion} quand la source la donne
# Page de référence des groupes : https://unfccc.int/process-and-meetings/parties-non-party-stakeholders/parties/party-groupings

- id: G77 and China
  nom: Groupe des 77 et la Chine
  type: negociation
  source: https://www.g77.org/doc/members.html
  parser: g77
  attendu: 134
  note: "La liste de g77.org (134 États) inclut la Chine."
  alias: [G77, G-77, G77+China, Groupe des 77]
- id: EU
  nom: Union européenne (27 États membres)
