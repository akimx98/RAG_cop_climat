# Dossiers de négociation de la COP31.
#   slug       identifiant stable (URL /dossiers/<slug>, commande Telegram /note <alias> …)
#   nom        libellé affiché
#   alias      mots reconnus en tête d'une note (/note GGA …) ; minuscules
#   cb         thèmes Carbon Brief rattachés (feuilles « Texts », « agenda-status », « Who wants what »)
#   requete    recherche dans le corpus pour le fil d'actualité du dossier (syntaxe des sujets suivis)
#   enjeu      une phrase pour un novice
- slug: couverture
  nom: "Décision de couverture et textes politiques"
  alias: [couverture, cover, politique, mutirao]
  cb: [Cover text]
  requete: "cover decision, cover text, décision de couverture, Antalya package, Mission 1.5"
  enjeu: "Le texte politique de synthèse que les présidences veulent faire adopter à la fin, où se jouent les grands signaux (1,5 °C, fossiles, financement)."
  nom_en: "Cover decision and political texts"
  enjeu_en: "The overarching political text the presidencies want adopted at the end, where the big signals play out (1.5 °C, fossil fuels, finance)."
