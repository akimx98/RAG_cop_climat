# Tests à chaque push et pull request : un commit qui casse le site (ex. une question qui n'aboutit plus) est
# signalé par GitHub (croix rouge, e-mail) avant même la mise en production. Aucun secret : OpenAI est simulé.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
